spring.application.name=leadyfy-os-backend

# Default local development database.
# Use H2 by default so the app can boot without a local MySQL install.
spring.datasource.url=${DB_URL:jdbc:h2:mem:leadyfy_os;MODE=MySQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE}
spring.datasource.username=${DB_USERNAME:sa}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=${DB_DRIVER:org.h2.Driver}

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

# Disable SQL init for the default H2 profile.
spring.sql.init.mode=never

# JWT settings
jwt.secret=${JWT_SECRET:CHANGE_ME_TO_A_STRONG_RANDOM_SECRET_32_PLUS_CHARS}
jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

# Optional MySQL override profile:
#   java -jar app.jar --spring.profiles.active=mysql
# or set DB_URL, DB_USERNAME, DB_PASSWORD before launch.
# Example MySQL profile config:
# spring.datasource.url=jdbc:mysql://localhost:3306/leadyfy_os?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
# spring.datasource.username=root
# spring.datasource.password=root
# spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
# spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
