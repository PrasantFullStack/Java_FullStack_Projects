# App name
spring.application.name=ApnaBazarBackend

# MySQL Database
spring.datasource.url=jdbc:mysql://localhost:3307/apna_db
spring.datasource.username=root
spring.datasource.password=root
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# Spring AI MCP Server (STDIO transport)
spring.ai.mcp.server.name=my-mcp-server
spring.ai.mcp.server.version=1.0.0
# spring.ai.mcp.server.transport=stdio

# OpenAI API Key (use ENV variable)
spring.ai.openai.api-key=${OPENAI_API_KEY}
spring.ai.openai.chat.options.model=gpt-5
spring.ai.openai.chat.options.temperature=0.7

# Cloudinary (use ENV variables)
cloudinary.cloud_name=${CLOUDINARY_CLOUD_NAME}
cloudinary.api_key=${CLOUDINARY_API_KEY}
cloudinary.api_secret=${CLOUDINARY_API_SECRET}

# JWT Secret (use ENV variable)
jwt.secret=${JWT_SECRET}

# File upload
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB
